name: 🚀 Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node / Vite build ──────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets (Vite)
        run: npm run build

      # ── Upload built assets to server ─────────────────────────────────────
      - name: Upload public/build via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build/"
          target: "${{ secrets.DEPLOY_PATH }}/public/"
          strip_components: 1

      # ── SSH: pull & artisan ────────────────────────────────────────────────
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Yeni kodları çek
            git pull origin main

            # PHP yolunu belirle (cPanel sürümüne göre secrets'tan alınır)
            PHP="${{ secrets.PHP_BIN }}"
            COMPOSER="${{ secrets.COMPOSER_BIN }}"

            # Cache'leri temizle ve yeniden oluştur
            $PHP artisan config:clear
            $PHP artisan route:clear
            $PHP artisan view:clear
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache

            # Migrasyon
            $PHP artisan migrate --force

            # Storage symlink (yoksa oluştur)
            $PHP artisan storage:link || true

            # İzinler
            chmod -R 755 storage bootstrap/cache

            echo "✅ Deployment tamamlandı: $(date '+%Y-%m-%d %H:%M:%S')"
